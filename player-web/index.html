<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Night - Player</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <!-- Connection Screen -->
        <div id="connect-screen" class="screen active">
            <div class="container">
                <div class="logo">
                    <div class="logo-icon">🎯</div>
                    <h1>Trivia Night</h1>
                </div>

                <div class="card">
                    <h2>Join Game</h2>
                    <form id="join-form">
                        <div class="form-group">
                            <label for="player-name">Your Name</label>
                            <input type="text" id="player-name" placeholder="Enter your name" required autocomplete="off" maxlength="20">
                        </div>
                        <div class="form-group">
                            <label for="game-code">Game Code</label>
                            <input type="text" id="game-code" placeholder="Enter game code" required autocomplete="off" maxlength="10" style="text-transform: uppercase;">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Join Game</button>
                    </form>
                    <div id="connection-status" class="status-message"></div>
                </div>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <div class="container">
                <div class="card">
                    <h2>Waiting for Game to Start</h2>
                    <div class="player-info">
                        <div class="player-badge">
                            <span class="player-icon">👤</span>
                            <span id="lobby-player-name" class="player-name"></span>
                        </div>
                    </div>
                    <div class="lobby-status">
                        <div class="spinner"></div>
                        <p>Waiting for host to start the game...</p>
                        <p class="player-count"><span id="player-count">0</span> players connected</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" class="screen">
            <div class="container">
                <div class="question-header">
                    <div class="question-number">Question <span id="current-question">1</span>/<span id="total-questions">10</span></div>
                    <div class="timer">
                        <div class="timer-circle">
                            <svg viewBox="0 0 100 100">
                                <circle class="timer-background" cx="50" cy="50" r="45"></circle>
                                <circle id="timer-progress" class="timer-foreground" cx="50" cy="50" r="45"></circle>
                            </svg>
                            <span id="timer-text" class="timer-text">30</span>
                        </div>
                    </div>
                </div>

                <div class="card question-card">
                    <h3 id="question-text" class="question-text"></h3>
                    <div id="question-image" class="question-image" style="display: none;">
                        <img id="question-img" src="" alt="Question image">
                    </div>
                </div>

                <div id="answer-section" class="answer-section">
                    <!-- Multiple choice answers will be inserted here -->
                    <!-- or text input field -->
                </div>

                <div id="submit-section" class="submit-section">
                    <button id="submit-answer" class="btn btn-primary btn-block" disabled>Submit Answer</button>
                </div>

                <div id="answer-feedback" class="answer-feedback"></div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <div class="container">
                <div class="card">
                    <div id="answer-result" class="result-indicator"></div>
                    <div id="points-earned" class="points-earned"></div>
                    <div class="current-score">
                        <p>Your Score</p>
                        <h2 id="current-score">0</h2>
                    </div>
                </div>

                <div class="card leaderboard">
                    <h3>Leaderboard</h3>
                    <div id="leaderboard-list" class="leaderboard-list"></div>
                </div>
            </div>
        </div>

        <!-- Final Results Screen -->
        <div id="final-screen" class="screen">
            <div class="container">
                <div class="card">
                    <h1>Game Over!</h1>
                    <div class="final-rank">
                        <div id="rank-icon" class="rank-icon"></div>
                        <h2>You placed <span id="final-rank"></span></h2>
                    </div>
                    <div class="final-score">
                        <p>Final Score</p>
                        <h2 id="final-score">0</h2>
                    </div>
                </div>

                <div class="card leaderboard">
                    <h3>Final Rankings</h3>
                    <div id="final-leaderboard" class="leaderboard-list"></div>
                </div>
            </div>
        </div>

        <!-- Disconnected Screen -->
        <div id="disconnected-screen" class="screen">
            <div class="container">
                <div class="card error-card">
                    <div class="error-icon">⚠️</div>
                    <h2>Connection Lost</h2>
                    <p>You have been disconnected from the game.</p>
                    <button id="reconnect-btn" class="btn btn-primary">Try to Reconnect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
